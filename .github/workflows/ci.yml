name: Go CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check generated tables are current
        run: |
          go generate ./...
          test -z "$(git status --porcelain)"

      - name: Run tests with race cond checks
        run: go test -v -race -p 1 -coverprofile=coverage.out ./...

  lint-with-sec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # pinned to the v2 series: .golangci.yml uses the v2 schema
          # (version: "2", formatters), which v1 rejects; v2 also reads the
          # export data of the Go 1.27 toolchain, which v1 cannot
          version: v2.15.0
          args: --timeout=3m

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep Analysis
        uses: returntocorp/semgrep-action@v1
        continue-on-error: true  # gosec already in pre-commit
        with:
          config: p/golang
          extra_args: --metrics=off
